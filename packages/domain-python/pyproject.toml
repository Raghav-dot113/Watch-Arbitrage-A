[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronoarb-domain"
version = "0.1.0"
description = "ChronoArb domain layer — pure business logic, value objects, and Protocol interfaces"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
test = [
    "hypothesis>=6.100,<7",
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["chronoarb"]

info:
  title: ChronoArb
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/activity:
    get:
      description: Lists recent activity for the authenticated organization.
      operationId: activity_listActivity
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: header
        name: X-Organization-ID
        required: false
        schema:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: X-Organization-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope_list_ActivityItemResponse__'
          description: Successful Response
        '401':
          content:
            application/json:
              example:
                error:
                  code: UNAUTHORIZED
                  field_errors: {}
                  message: Authentication is required or the supplied credentials are invalid.
                  retryable: false
                  trace_id: 00000000-0000-4000-8000-000000000001
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Authentication is required or the supplied credentials are invalid.
        '403':
          content:
            application/json:
              example:
                error:
                  code: FORBIDDEN
                  field_errors: {}
                  message: The authenticated user does not have permission for this operation.
                  retryable: false
                  trace_id: 00000000-0000-4000-8000-000000000001
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: The authenticated user does not have permission for this operation.
        '405':
          content:
            application/json:
              example:
                error:
                  code: METHOD_NOT_ALLOWED
                  field_errors: {}
                  message: The HTTP method is not allowed for this resource.
                  retryable: false
                  trace_id: 00000000-0000-4000-8000-000000000001
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: The HTTP method is not allowed for this resource.
        '422':
          content:
            application/json:
              example:
                error:
                  code: VALIDATION_ERROR
                  field_errors: {}
                  message: One or more fields are invalid.
                  retryable: false
                  trace_id: 00000000-0000-4000-8000-000000000001
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: One or more fields are invalid.
        '500':
          content:
            application/json:
              example:
                error:
                  code: INTERNAL_ERROR
                  field_errors: {}
                  message: An internal error occurred.
                  retryable: true
                  trace_id: 00000000-0000-4000-8000-000000000001
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: An internal error occurred.
      security:
      - BearerJWT: []
      summary: List Activity
      tags:
      - activity
  /api/v1/activity/outcomes:
    get:
      description: Lists realized trade outcomes for the authenticated organization.
      operationId: activity_listTradeOutcomes
      parameters:
      - in: query
        name: limit
